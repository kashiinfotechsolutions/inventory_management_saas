version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: scoopstock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: scoopstock
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: scoopstock-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  web:
    image: node:20-bookworm-slim
    container_name: scoopstock-web
    working_dir: /app
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/scoopstock?schema=public
      JWT_SECRET: change-me-access-secret
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev:web"
    ports:
      - '3000:3000'

volumes:
  postgres_data:
  web_node_modules:
